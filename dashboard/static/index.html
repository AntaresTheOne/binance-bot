<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель робота</title>
<style>
  /* ---------- токены: тёмная тема по умолчанию ---------- */
  :root {
    color-scheme: dark;
    --page: #070a12;
    --page-2: #0b1020;
    --surface: #111522;
    --surface-2: #171c2c;
    --surface-3: #1e2437;
    --ink: #eef1f6;
    --ink-2: #a9b1c3;
    --muted: #7c859a;
    --grid: #1f2638;
    --axis: #2c3550;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --accent: #f59e0b;
    --accent-ink: #1a1203;
    --accent-soft: rgba(245, 158, 11, 0.14);
    --glow-1: rgba(245, 158, 11, 0.13);
    --glow-2: rgba(57, 135, 229, 0.12);
    --series-price: #eef1f6;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --coin-btc: #c98500;
    --coin-eth: #627eea;
    --good: #0ca30c;
    --good-soft: rgba(12, 163, 12, 0.14);
    --warning: #fab219;
    --warning-soft: rgba(250, 178, 25, 0.13);
    --critical: #d03b3b;
    --critical-soft: rgba(208, 59, 59, 0.14);
    --good-text: #3fcf5f;
    --critical-text: #f07b7b;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 24px 48px -28px rgba(0, 0, 0, 0.7);
    --radius: 18px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page: #f3f4f8;
    --page-2: #eceef5;
    --surface: #ffffff;
    --surface-2: #f4f5f9;
    --surface-3: #e9ecf3;
    --ink: #0e1320;
    --ink-2: #4a5265;
    --muted: #6b7386;
    --grid: #e7e9f0;
    --axis: #cdd2de;
    --border: rgba(14, 19, 32, 0.09);
    --border-strong: rgba(14, 19, 32, 0.18);
    --accent: #d98200;
    --accent-ink: #ffffff;
    --accent-soft: rgba(217, 130, 0, 0.12);
    --glow-1: rgba(245, 158, 11, 0.16);
    --glow-2: rgba(57, 135, 229, 0.10);
    --series-price: #0e1320;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --coin-btc: #d98200;
    --coin-eth: #4f6bd8;
    --good-soft: rgba(12, 163, 12, 0.10);
    --warning-soft: rgba(250, 178, 25, 0.16);
    --critical-soft: rgba(208, 59, 59, 0.09);
    --good-text: #006300;
    --critical-text: #b32525;
    --shadow: 0 1px 2px rgba(14, 19, 32, 0.05), 0 18px 40px -24px rgba(14, 19, 32, 0.22);
  }
  @media (prefers-color-scheme: light) {
    :root:where(:not([data-theme="dark"])) {
      color-scheme: light;
      --page: #f3f4f8;
      --page-2: #eceef5;
      --surface: #ffffff;
      --surface-2: #f4f5f9;
      --surface-3: #e9ecf3;
      --ink: #0e1320;
      --ink-2: #4a5265;
      --muted: #6b7386;
      --grid: #e7e9f0;
      --axis: #cdd2de;
      --border: rgba(14, 19, 32, 0.09);
      --border-strong: rgba(14, 19, 32, 0.18);
      --accent: #d98200;
      --accent-ink: #ffffff;
      --accent-soft: rgba(217, 130, 0, 0.12);
      --glow-1: rgba(245, 158, 11, 0.16);
      --glow-2: rgba(57, 135, 229, 0.10);
      --series-price: #0e1320;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --coin-btc: #d98200;
      --coin-eth: #4f6bd8;
      --good-soft: rgba(12, 163, 12, 0.10);
      --warning-soft: rgba(250, 178, 25, 0.16);
      --critical-soft: rgba(208, 59, 59, 0.09);
      --good-text: #006300;
      --critical-text: #b32525;
      --shadow: 0 1px 2px rgba(14, 19, 32, 0.05), 0 18px 40px -24px rgba(14, 19, 32, 0.22);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    color: var(--ink);
    font: 15px/1.55 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(900px 520px at 8% -8%, var(--glow-1), transparent 62%),
      radial-gradient(820px 520px at 100% 0%, var(--glow-2), transparent 60%),
      linear-gradient(180deg, var(--page-2), var(--page) 420px);
    background-color: var(--page);
    background-attachment: fixed;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 56px; }

  /* ---------- шапка ---------- */
  header.top {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 14px 20px; margin: 0 -20px 8px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--page-2) 80%, transparent), transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(145deg, #fbbf24, #f59e0b 55%, #b45309);
    color: #1a1203; font-size: 20px;
    box-shadow: 0 8px 22px -8px rgba(245, 158, 11, 0.65), 0 1px 0 rgba(255, 255, 255, 0.45) inset;
  }
  .brand h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; line-height: 1.2; }
  .brand p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
  .spacer { flex: 1 1 auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; min-height: 34px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 13px; color: var(--ink-2); white-space: nowrap;
  }
  .chip strong { color: var(--ink); font-weight: 600; }
  .chip.mode { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
  .chip.mode svg { color: var(--accent); }
  .live { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .live.good { background: var(--good); }
  .live.warning { background: var(--warning); }
  .live.critical { background: var(--critical); }
  .live.good::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--good); opacity: 0; animation: ping 2.4s var(--ease) infinite;
  }
  @keyframes ping { 0% { transform: scale(0.5); opacity: 0.7; } 80%, 100% { transform: scale(1.5); opacity: 0; } }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; cursor: pointer; font-size: 17px;
    background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
    display: inline-grid; place-items: center; transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--border-strong); }
  .icon-btn .sun { display: none; }
  :root[data-theme="light"] .icon-btn .sun { display: block; }
  :root[data-theme="light"] .icon-btn .moon { display: none; }
  @media (prefers-color-scheme: light) {
    :root:where(:not([data-theme="dark"])) .icon-btn .sun { display: block; }
    :root:where(:not([data-theme="dark"])) .icon-btn .moon { display: none; }
  }

  /* ---------- карточки ---------- */
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow);
    transition: border-color 0.2s, transform 0.25s var(--ease);
  }
  .card.lift:hover { border-color: var(--border-strong); transform: translateY(-2px); }
  .section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 34px 0 14px; }
  .section-head h2 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .section-head h2 svg { color: var(--accent); font-size: 18px; }
  .section-head .hint { font-size: 13px; color: var(--muted); }

  main.first > * { animation: rise 0.55s var(--ease) both; }
  main.first > *:nth-child(2) { animation-delay: 0.05s; }
  main.first > *:nth-child(3) { animation-delay: 0.10s; }
  main.first > *:nth-child(n+4) { animation-delay: 0.15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- верхний блок ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
  .state { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; overflow: hidden; }
  .state::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(420px 220px at 0% 0%, var(--tone-soft, var(--accent-soft)), transparent 70%);
  }
  .state > * { position: relative; }
  .orb {
    width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; font-size: 26px;
    color: var(--tone, var(--accent)); background: var(--tone-soft, var(--accent-soft));
    border: 1px solid color-mix(in srgb, var(--tone, var(--accent)) 35%, transparent);
  }
  .eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .state h2 { font-size: 27px; line-height: 1.2; margin: 6px 0 0; font-weight: 680; letter-spacing: -0.02em; }
  .notes { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .notes li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; }
  .notes b { color: var(--ink); font-weight: 600; }

  .coin { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-weight: 700; font-size: 14px; color: #fff; background: var(--coin, var(--muted)); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset; }
  .coin.lg { width: 44px; height: 44px; font-size: 21px; }

  .balance .label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .balance .label svg { color: var(--accent); font-size: 15px; }
  .balance .value { font-size: 52px; font-weight: 700; line-height: 1.05; letter-spacing: -0.03em; margin-top: 8px; }
  .balance .unit { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
  .delta { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 5px 11px; border-radius: 999px; font-size: 13.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
  .delta.up { background: var(--good-soft); color: var(--good-text); }
  .delta.down { background: var(--critical-soft); color: var(--critical-text); }
  .delta + .sub { display: inline; margin-left: 10px; }
  .sub { font-size: 13px; color: var(--muted); }

  .alloc { margin-top: 20px; }
  .alloc-bar { display: flex; gap: 2px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-3); }
  .alloc-bar span { display: block; height: 100%; min-width: 3px; border-radius: 999px; }
  .alloc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .alloc-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }

  .mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  .mini .k { font-size: 12.5px; color: var(--muted); }
  .mini .v { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; }

  /* ---------- сигналы ---------- */
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; min-height: 34px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-2); transition: background 0.18s, color 0.18s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

  .signals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .signal-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .signal-name { display: flex; align-items: center; gap: 12px; }
  .signal-name h3 { margin: 0; font-size: 17px; font-weight: 650; line-height: 1.2; }
  .signal-name p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink); }
  .badge svg { font-size: 15px; }
  .badge.up { background: var(--good-soft); }
  .badge.up svg { color: var(--good-text); }
  .badge.down { background: var(--critical-soft); }
  .badge.down svg { color: var(--critical-text); }
  .badge.flat svg { color: var(--muted); }

  .price-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-top: 18px; }
  .price-row .p { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .price-row .delta { margin-top: 0; }
  .price-row .sub { flex-basis: 100%; }

  .votes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  .vote { background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; }
  .vote .k { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .vote .k i { font-style: normal; display: inline-flex; align-items: center; gap: 5px; }
  .vote .v { font-weight: 650; font-size: 16px; margin-top: 3px; }
  .vote .s { font-size: 12px; color: var(--muted); }
  .vote .k svg { font-size: 14px; }
  .vote.above .k svg { color: var(--good-text); }
  .vote.below .k svg { color: var(--critical-text); }

  .meter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; margin-top: 16px; }
  .meter .track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .meter .track span { height: 8px; border-radius: 999px; background: var(--surface-3); }
  .meter .track span.on { background: var(--good); }
  .meter .cap { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .explain { margin: 10px 0 0; color: var(--ink-2); font-size: 14px; }
  .explain b { color: var(--ink); font-weight: 600; }

  .chart { position: relative; margin-top: 18px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; border-radius: 8px; }
  .chart text { font: 11px "Inter", "Segoe UI", system-ui, sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .endlabel { fill: var(--ink); font-weight: 650; font-size: 12px; }
  .chart .levellabel { fill: var(--ink-2); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .key { width: 16px; height: 0; border-top: 2px solid; border-radius: 2px; flex: none; }
  .key.thin { border-top-width: 1px; }
  .tip {
    position: absolute; pointer-events: none; z-index: 5; min-width: 204px; display: none;
    background: color-mix(in srgb, var(--surface-2) 94%, transparent); border: 1px solid var(--border-strong); border-radius: 12px;
    box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.55); padding: 10px 12px; font-size: 12.5px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .tip .d { font-weight: 650; margin-bottom: 6px; }
  .tip .r { display: flex; align-items: center; gap: 8px; color: var(--ink-2); padding: 1px 0; }
  .tip .r b { margin-left: auto; padding-left: 16px; color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }

  details.table-view { margin-top: 12px; }
  details.table-view summary { cursor: pointer; font-size: 13px; color: var(--ink-2); width: fit-content; padding: 6px 0; }
  details.table-view summary:hover { color: var(--ink); }

  /* ---------- таблицы и пустые состояния ---------- */
  .scroll-x { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 11px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td .coin { margin-right: 10px; vertical-align: middle; }
  .gain { color: var(--good-text); font-weight: 600; }
  .loss { color: var(--critical-text); font-weight: 600; }

  .empty { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
  .empty .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 22px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--border-strong); }
  .empty b { display: block; font-weight: 650; font-size: 15.5px; }
  .empty span { color: var(--ink-2); font-size: 14px; }

  /* ---------- новости ---------- */
  .veto { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 14px; border-color: color-mix(in srgb, var(--critical) 45%, transparent); background: linear-gradient(0deg, var(--critical-soft), var(--critical-soft)), var(--surface); }
  .veto .ic { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; font-size: 22px; color: var(--critical-text); background: var(--critical-soft); }
  .veto h3 { margin: 0; font-size: 17px; font-weight: 650; }
  .veto p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
  .veto .until { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 12.5px; color: var(--ink-2); }
  .veto a, .news-item a { text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 3px; transition: text-decoration-color 0.15s; }
  .veto a:hover, .news-item a:hover { text-decoration-color: currentColor; }

  .news { display: grid; }
  .news-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 16px; padding: 16px 0; border-bottom: 1px solid var(--border); }
  .news-item:first-child { padding-top: 2px; }
  .news-item:last-child { border-bottom: 0; padding-bottom: 2px; }
  .news-item .dir { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 18px; background: var(--surface-2); color: var(--muted); }
  .news-item .dir.down { background: var(--critical-soft); color: var(--critical-text); }
  .news-item .dir.up { background: var(--good-soft); color: var(--good-text); }
  .news-item .title { font-weight: 600; font-size: 15px; line-height: 1.4; }
  .news-item .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .news-item .meta .asset { padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .news-item .reason { color: var(--ink-2); margin-top: 6px; font-size: 14px; }
  .impact { text-align: right; min-width: 132px; }
  .impact .lab { font-size: 13px; font-weight: 600; }
  .impact .dots { display: inline-flex; gap: 4px; margin-top: 6px; }
  .impact .dots i { width: 18px; height: 5px; border-radius: 999px; background: var(--surface-3); }
  .impact .dots i.on { background: var(--ink-2); }
  .impact .conf { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--critical-soft); color: var(--critical-text); margin-left: 8px; vertical-align: 2px; white-space: nowrap; }
  .more { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 8px 14px; min-height: 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-size: 13.5px; color: var(--ink-2); transition: color 0.18s, border-color 0.18s; }
  .more:hover { color: var(--ink); border-color: var(--border-strong); }

  footer { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .stale { opacity: 0.55; transition: opacity 0.2s; }

  @media (max-width: 1100px) {
    .chip .extra { display: none; }
  }
  @media (max-width: 960px) {
    .hero, .signals { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .wrap { padding: 0 14px 40px; }
    header.top { position: static; backdrop-filter: none; -webkit-backdrop-filter: none; background: none; padding: 14px 0; margin: 0 0 8px; }
    .card { padding: 18px; }
    .state { grid-template-columns: minmax(0, 1fr); }
    .state h2 { font-size: 23px; }
    .balance .value { font-size: 42px; }
    .price-row .p { font-size: 31px; }
    .news-item { grid-template-columns: auto minmax(0, 1fr); }
    .impact { grid-column: 2; text-align: left; margin-top: 6px; }
    .impact .conf { display: inline; margin-left: 8px; }
    .vote { padding: 9px; }
    .chip .extra { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div>
      <div><h1>Торговый робот</h1><p id="subtitle">Загрузка…</p></div>
    </div>
    <span class="spacer"></span>
    <span class="chip mode" id="mode"></span>
    <span class="chip" id="bot-status"><span class="live"></span>Загрузка…</span>
    <span class="chip" id="news-status"></span>
    <button class="icon-btn" id="theme" type="button" aria-label="Переключить светлую и тёмную тему" title="Светлая или тёмная тема">
      <svg class="i moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="i sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </header>

  <main id="main" class="first"></main>

  <footer>
    <p>Панель только показывает данные и ничем не управляет: она не может купить, продать или изменить настройки робота.
    Обновляется сама каждые 30 секунд. <span id="updated"></span></p>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const SERIES = [
    { key: "close", name: "Цена закрытия дня", color: "var(--series-price)" },
    { key: "sma50", name: "Средняя за 50 дней", color: "var(--series-1)" },
    { key: "sma100", name: "Средняя за 100 дней", color: "var(--series-2)" },
    { key: "sma200", name: "Средняя за 200 дней", color: "var(--series-3)" },
  ];
  const RANGES = [{ days: 90, label: "90 дней" }, { days: 180, label: "180 дней" }, { days: 365, label: "Год" }];
  const COINS = {
    BTC: { name: "Bitcoin", glyph: "₿", color: "var(--coin-btc)" },
    ETH: { name: "Ethereum", glyph: "Ξ", color: "var(--coin-eth)" },
  };
  const SVG_NS = "http://www.w3.org/2000/svg";
  const ICONS = {
    up: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    down: '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
    flat: '<path d="M5 12h14"/>',
    arrowUp: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
    arrowDown: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
    ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
    wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    activity: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
    news: '<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    hourglass: '<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>',
    power: '<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>',
    list: '<path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/>',
    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    flask: '<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>',
    chevron: '<path d="m6 9 6 6 6-6"/>',
  };

  let state = null;
  let rangeDays = 180;
  let showAllNews = false;
  let firstRender = true;
  try { rangeDays = Number(localStorage.getItem("range")) || 180; } catch (e) { /* хранилище недоступно */ }

  // ---------- помощники ----------
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false || child === "") continue;
      el.append(child.nodeType ? child : document.createTextNode(String(child)));
    }
    return el;
  }
  function s(tag, attrs, ...children) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
    for (const child of children.flat()) if (child) el.append(child.nodeType ? child : document.createTextNode(String(child)));
    return el;
  }
  function icon(name) {
    const svg = s("svg", { class: "i", viewBox: "0 0 24 24", "aria-hidden": "true" });
    svg.innerHTML = ICONS[name];
    return svg;
  }
  function coinBadge(pair, large) {
    const code = pair.split("/")[0];
    const meta = COINS[code] || { glyph: code.slice(0, 1), color: "var(--muted)" };
    return h("span", { class: `coin${large ? " lg" : ""}`, style: `--coin:${meta.color}`, "aria-hidden": "true" }, meta.glyph);
  }

  const nf0 = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nf1 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const price = (v) => (v === null || v === undefined ? "—" : Math.abs(v) >= 1000 ? nf0.format(v) : nf2.format(v));
  const signed = (v, fmt) => (v > 0 ? "+" : v < 0 ? "−" : "") + fmt.format(Math.abs(v));
  const dtf = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const dayf = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  const dayShort = new Intl.DateTimeFormat("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" });
  const monthf = new Intl.DateTimeFormat("ru-RU", { month: "short", timeZone: "UTC" });
  const when = (iso) => (iso ? dtf.format(new Date(iso)).replace(".", "") : "—");
  const utcDay = (d) => new Date(d + "T00:00:00Z");

  function ago(seconds) {
    if (seconds === null || seconds === undefined) return "нет данных";
    if (seconds < 90) return `${Math.max(0, Math.round(seconds))} с назад`;
    if (seconds < 5400) return `${Math.round(seconds / 60)} мин назад`;
    if (seconds < 129600) return `${Math.round(seconds / 3600)} ч назад`;
    return `${Math.round(seconds / 86400)} дн назад`;
  }

  // ---------- график ----------
  function niceTicks(min, max, count) {
    const raw = (max - min || 1) / count;
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * pow).find((v) => v >= raw);
    const ticks = [];
    for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) ticks.push(Number(v.toFixed(8)));
    return ticks;
  }
  const axisLabel = (v, top) => (top >= 10000 ? `${nf0.format(v / 1000)} тыс.` : nf0.format(v));

  function drawChart(host, pair, days) {
    host.replaceChildren();
    const all = pair.series;
    const from = Math.max(0, all.dates.length - days);
    const dates = all.dates.slice(from);
    const lines = SERIES.map((def) => ({ ...def, values: all[def.key].slice(from) }));
    const n = dates.length;
    if (n < 2) { host.append(h("p", { class: "sub" }, "Недостаточно данных для графика.")); return; }

    const W = Math.max(300, host.clientWidth), H = 280;
    const m = { t: 14, r: 64, b: 28, l: 56 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const flat = lines.flatMap((l) => l.values).filter((v) => v !== null);
    const level = pair.flip_level;
    let lo = Math.min(...flat), hi = Math.max(...flat);
    const pad = (hi - lo) * 0.07 || hi * 0.02;
    lo -= pad; hi += pad;
    const x = (i) => m.l + (i / (n - 1)) * iw;
    const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * ih;
    const gid = `area-${pair.pair.replace(/\W/g, "")}`;

    const svg = s("svg", {
      viewBox: `0 0 ${W} ${H}`, role: "img", tabindex: "0",
      "aria-label": `${pair.pair}: цена закрытия и три скользящие средние за ${n} дн. Значения — в таблице под графиком.`,
    });
    svg.append(s("defs", {}, s("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 },
      s("stop", { offset: "0%", "stop-color": "var(--series-price)", "stop-opacity": 0.13 }),
      s("stop", { offset: "100%", "stop-color": "var(--series-price)", "stop-opacity": 0 }))));

    for (const t of niceTicks(lo, hi, 4)) {
      svg.append(s("line", { x1: m.l, x2: m.l + iw, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }));
      svg.append(s("text", { x: m.l - 10, y: y(t) + 4, "text-anchor": "end" }, axisLabel(t, hi)));
    }
    svg.append(s("line", { x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 }));

    const months = [];
    dates.forEach((d, i) => { if (d.endsWith("-01")) months.push(i); });
    const every = Math.max(1, Math.ceil((months.length * 48) / iw));
    months.forEach((i, k) => {
      if (k % every) return;
      const date = utcDay(dates[i]);
      const label = date.getUTCMonth() === 0 ? String(date.getUTCFullYear()) : monthf.format(date).replace(".", "");
      if (x(i) > m.l + 14 && x(i) < m.l + iw - 14) svg.append(s("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, label));
    });

    // Уровень смены сигнала — тонкая сплошная линия с подписью, если он попадает в окно графика.
    if (level !== null && level > lo && level < hi) {
      svg.append(s("line", { x1: m.l, x2: m.l + iw, y1: y(level), y2: y(level), stroke: "var(--ink-2)", "stroke-width": 1, opacity: 0.55 }));
      svg.append(s("text", { class: "levellabel", x: m.l + 6, y: y(level) - 6 }, pair.uptrend ? "уровень выхода" : "уровень покупки"));
    }

    const pathOf = (values) => {
      let d = "", pen = false;
      values.forEach((v, i) => {
        if (v === null) { pen = false; return; }
        d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
        pen = true;
      });
      return d;
    };
    const priceValues = lines[0].values;
    svg.append(s("path", { d: `${pathOf(priceValues)}L${x(n - 1).toFixed(1)},${m.t + ih}L${x(0).toFixed(1)},${m.t + ih}Z`, fill: `url(#${gid})` }));
    for (const line of [...lines].reverse()) {
      svg.append(s("path", { d: pathOf(line.values), fill: "none", stroke: line.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }

    const lastPrice = priceValues[n - 1];
    svg.append(s("circle", { cx: x(n - 1), cy: y(lastPrice), r: 4.5, fill: "var(--series-price)", stroke: "var(--surface)", "stroke-width": 2 }));
    svg.append(s("text", { class: "endlabel", x: x(n - 1) + 10, y: y(lastPrice) + 4 }, price(lastPrice)));

    const cross = s("g", { style: "display:none" });
    const rule = s("line", { y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 });
    const dots = lines.map((l) => s("circle", { r: 4.5, fill: l.color, stroke: "var(--surface)", "stroke-width": 2 }));
    cross.append(rule, ...dots);
    svg.append(cross);

    const tip = h("div", { class: "tip", role: "status" });
    function show(i) {
      i = Math.max(0, Math.min(n - 1, i));
      svg.dataset.index = i;
      cross.style.display = "";
      rule.setAttribute("x1", x(i)); rule.setAttribute("x2", x(i));
      lines.forEach((l, k) => {
        const v = l.values[i];
        dots[k].style.display = v === null ? "none" : "";
        if (v !== null) { dots[k].setAttribute("cx", x(i)); dots[k].setAttribute("cy", y(v)); }
      });
      tip.replaceChildren(
        h("div", { class: "d" }, dayf.format(utcDay(dates[i]))),
        ...lines.map((l) => h("div", { class: "r" }, h("span", { class: "key", style: `border-color:${l.color}` }), l.name, h("b", {}, price(l.values[i])))),
      );
      tip.style.display = "block";
      const px = (x(i) / W) * host.clientWidth;
      const tw = tip.offsetWidth;
      tip.style.left = `${Math.max(0, Math.min(host.clientWidth - tw, px > host.clientWidth / 2 ? px - tw - 14 : px + 14))}px`;
      tip.style.top = "6px";
    }
    function hide() { cross.style.display = "none"; tip.style.display = "none"; }
    svg.addEventListener("pointermove", (e) => {
      const box = svg.getBoundingClientRect();
      show(Math.round((((e.clientX - box.left) / box.width) * W - m.l) / iw * (n - 1)));
    });
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("focus", () => show(n - 1));
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", (e) => {
      const i = Number(svg.dataset.index ?? n - 1);
      if (e.key === "ArrowLeft") { show(i - 1); e.preventDefault(); }
      if (e.key === "ArrowRight") { show(i + 1); e.preventDefault(); }
    });
    host.append(svg, tip);
  }

  function tableView(pair) {
    const sr = pair.series, rows = [];
    for (let i = sr.dates.length - 1; i >= Math.max(0, sr.dates.length - 14); i--) {
      rows.push(h("tr", {}, h("td", {}, dayShort.format(utcDay(sr.dates[i]))), ...SERIES.map((d) => h("td", { class: "num" }, price(sr[d.key][i])))));
    }
    return h("details", { class: "table-view" },
      h("summary", {}, "Показать таблицей (последние 14 дней)"),
      h("div", { class: "scroll-x" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "День"), ...SERIES.map((d) => h("th", { class: "num" }, d.name)))),
        h("tbody", {}, rows))));
  }

  // ---------- разделы ----------
  function stateCard(st) {
    const holding = st.trades.open.length > 0;
    const tone = !st.bot.running ? ["power", "var(--critical-text)", "var(--critical-soft)"]
      : holding ? ["up", "var(--good-text)", "var(--good-soft)"]
      : ["hourglass", "var(--accent)", "var(--accent-soft)"];
    return h("section", { class: "card state", style: `--tone:${tone[1]};--tone-soft:${tone[2]}` },
      h("div", { class: "orb", "aria-hidden": "true" }, icon(tone[0])),
      h("div", {},
        h("div", { class: "eyebrow" }, "Что происходит сейчас"),
        h("h2", {}, st.headline.title),
        h("ul", { class: "notes" }, st.headline.notes.map((note) => {
          const cut = note.indexOf(":");
          const code = note.slice(0, cut);
          return h("li", {}, coinBadge(`${code}/`), h("span", {}, h("b", {}, COINS[code] ? COINS[code].name : code), note.slice(cut)));
        }))));
  }

  function balanceCard(st) {
    const w = st.wallet, total = w.closed_profit + w.open_profit;
    const cls = total > 0 ? "up" : total < 0 ? "down" : "";
    const parts = st.trades.open.map((t) => ({ label: t.pair.split("/")[0], value: (t.stake || 0) + (t.profit_abs || 0), color: (COINS[t.pair.split("/")[0]] || {}).color || "var(--muted)" }));
    const invested = parts.reduce((a, p) => a + p.value, 0);
    const cash = Math.max(0, w.balance - invested);
    const segments = [{ label: "В деньгах", value: cash, color: "var(--ink-2)" }, ...parts].filter((p) => p.value > 0);
    const share = (v) => (w.balance > 0 ? Math.round((v / w.balance) * 100) : 0);
    const winRate = st.stats.closed ? `${Math.round((st.stats.wins / st.stats.closed) * 100)}%` : "—";

    return h("section", { class: "card balance" },
      h("div", { class: "label" }, icon("wallet"), "Баланс" + (st.mode === "dry_run" ? " · виртуальные деньги" : "")),
      h("div", { class: "value" }, nf2.format(w.balance), h("span", { class: "unit" }, st.currency)),
      h("span", { class: `delta ${cls}` }, total !== 0 ? icon(total > 0 ? "arrowUp" : "arrowDown") : null, `${signed(total, nf2)} ${st.currency} · ${signed(w.profit_pct, nf1)}%`),
      h("span", { class: "sub" }, `от начальных ${nf0.format(w.start)} ${st.currency}`),
      h("div", { class: "alloc" },
        h("div", { class: "alloc-bar", role: "img", "aria-label": segments.map((p) => `${p.label}: ${share(p.value)}%`).join(", ") },
          segments.map((p) => h("span", { style: `flex:${p.value} 1 0;background:${p.color}`, title: `${p.label}: ${share(p.value)}%` }))),
        h("div", { class: "alloc-legend" }, segments.map((p) => h("span", {}, h("span", { class: "swatch", style: `background:${p.color}` }), `${p.label} · ${share(p.value)}%`)))),
      h("div", { class: "mini" },
        h("div", {}, h("div", { class: "k" }, "Открыто позиций"), h("div", { class: "v" }, `${st.stats.open} из ${st.pairs.length || 2}`)),
        h("div", {}, h("div", { class: "k" }, "Закрыто сделок"), h("div", { class: "v" }, String(st.stats.closed))),
        h("div", {}, h("div", { class: "k" }, "Доля прибыльных"), h("div", { class: "v" }, winRate))));
  }

  function signalCard(pair, holding) {
    const [code, quote] = pair.pair.split("/");
    const meta = COINS[code] || { name: code };
    const badge = pair.uptrend
      ? h("span", { class: "badge up" }, icon("up"), holding ? "Тренд вверх · позиция открыта" : "Тренд вверх · сигнал на покупку")
      : h("span", { class: "badge down" }, icon("down"), "Тренд вниз · робот в деньгах");
    const day = (pair.price / pair.last_close - 1) * 100;
    const dayCls = day > 0.005 ? "up" : day < -0.005 ? "down" : "";

    const votes = h("div", { class: "votes" }, ["50", "100", "200"].map((win) => {
      const above = pair.above[win];
      return h("div", { class: `vote ${above ? "above" : "below"}`, title: `Средняя цена закрытия за ${win} дней` },
        h("div", { class: "k" }, `Средняя ${win} дн.`, h("i", {}, icon(above ? "arrowUp" : "arrowDown"))),
        h("div", { class: "v num" }, price(pair.smas[win])),
        h("div", { class: "s" }, above ? "цена выше" : "цена ниже"));
    }));

    const explain = pair.flip_level === null ? null : h("p", { class: "explain" }, pair.uptrend
      ? ["Сигнал пропадёт, если день закроется ниже ≈ ", h("b", {}, price(pair.flip_level)), ` (${signed(pair.distance_pct, nf1)}% от последнего закрытия).`]
      : ["Для покупки нужно минимум 2 из 3. Это случится, если день закроется выше ≈ ", h("b", {}, price(pair.flip_level)), ` (${signed(pair.distance_pct, nf1)}% от последнего закрытия).`]);

    return h("section", { class: "card signal" },
      h("div", { class: "signal-head" },
        h("div", { class: "signal-name" }, coinBadge(pair.pair, true), h("div", {}, h("h3", {}, meta.name), h("p", {}, `${code} / ${quote}`))),
        badge),
      h("div", { class: "price-row" },
        h("span", { class: "p" }, price(pair.price)),
        h("span", { class: `delta ${dayCls}` }, dayCls ? icon(day > 0 ? "arrowUp" : "arrowDown") : null, `${signed(day, nf1)}% за сегодня`),
        h("span", { class: "sub" }, `Последнее закрытие дня, ${dayShort.format(utcDay(pair.last_close_date))}: ${price(pair.last_close)}`)),
      votes,
      h("div", { class: "meter" },
        h("div", { class: "track", role: "img", "aria-label": `Цена выше ${pair.votes} из 3 средних` }, [0, 1, 2].map((i) => h("span", { class: i < pair.votes ? "on" : "" }))),
        h("span", { class: "cap" }, `Выше ${pair.votes} из 3 средних`)),
      explain,
      h("div", { class: "chart", "data-pair": pair.pair }),
      h("div", { class: "legend" },
        SERIES.map((d) => h("span", {}, h("span", { class: "key", style: `border-color:${d.color}` }), d.name)),
        pair.flip_level !== null ? h("span", {}, h("span", { class: "key thin", style: "border-color:var(--ink-2)" }), pair.uptrend ? "Уровень выхода" : "Уровень покупки") : null),
      tableView(pair));
  }

  const EXIT = { trend_lost: "тренд закончился", stop_loss: "аварийный стоп", force_exit: "закрыта вручную", stoploss_on_exchange: "аварийный стоп" };
  const pnlCell = (text, v) => h("td", { class: `num ${v > 0 ? "gain" : v < 0 ? "loss" : ""}` }, text);
  const pairCell = (p) => h("td", {}, coinBadge(p), p);

  function tradesSection(st) {
    const cur = st.currency, out = [];
    if (st.trades.open.length) {
      out.push(h("div", { class: "card" }, h("div", { class: "scroll-x" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "Открытая позиция"), h("th", {}, "Куплено"), h("th", { class: "num" }, "Цена входа"),
          h("th", { class: "num" }, "Цена сейчас"), h("th", { class: "num" }, `Сумма, ${cur}`), h("th", { class: "num" }, "Результат"))),
        h("tbody", {}, st.trades.open.map((t) => h("tr", {},
          pairCell(t.pair), h("td", {}, when(t.open_date)), h("td", { class: "num" }, price(t.open_rate)),
          h("td", { class: "num" }, price(t.price)), h("td", { class: "num" }, nf2.format(t.stake)),
          t.profit_abs === null ? h("td", { class: "num" }, "—") : pnlCell(`${signed(t.profit_abs, nf2)} (${signed(t.profit_pct, nf1)}%)`, t.profit_abs))))))));
    }
    if (st.trades.closed.length) {
      out.push(h("div", { class: "card", style: out.length ? "margin-top:14px" : "" }, h("div", { class: "scroll-x" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "Закрытая сделка"), h("th", {}, "Куплено"), h("th", {}, "Продано"), h("th", { class: "num" }, "Цена входа"),
          h("th", { class: "num" }, "Цена выхода"), h("th", { class: "num" }, `Результат, ${cur}`), h("th", { class: "num" }, "%"), h("th", {}, "Причина выхода"))),
        h("tbody", {}, st.trades.closed.map((t) => h("tr", {},
          pairCell(t.pair), h("td", {}, when(t.open_date)), h("td", {}, when(t.close_date)),
          h("td", { class: "num" }, price(t.open_rate)), h("td", { class: "num" }, price(t.close_rate)),
          pnlCell(signed(t.profit_abs || 0, nf2), t.profit_abs || 0), pnlCell(signed(t.profit_pct || 0, nf1), t.profit_pct || 0),
          h("td", {}, EXIT[t.exit_reason] || t.exit_reason || "—"))))))));
    }
    if (!out.length) {
      out.push(h("div", { class: "card empty" },
        h("div", { class: "ic", "aria-hidden": "true" }, icon("inbox")),
        h("div", {}, h("b", {}, "Сделок пока нет"), h("span", {}, "Робот покупает только при восходящем тренде. Пока его нет, деньги остаются нетронутыми."))));
    }
    return out;
  }

  const DIRECTION = { bearish: ["down", "down", "Негатив"], bullish: ["up", "up", "Позитив"], neutral: ["flat", "", "Нейтрально"] };
  const SEVERITY = { high: [3, "сильное влияние"], medium: [2, "среднее влияние"], low: [1, "слабое влияние"], none: [0, "без влияния"] };
  const CONFIDENCE = { high: "уверенность высокая", medium: "уверенность средняя", low: "уверенность низкая" };
  const safeLink = (url, text) => (url && /^https?:\/\//.test(url) ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, text) : text);

  function newsSection(st) {
    const out = [];
    for (const v of st.news.vetoes) {
      out.push(h("div", { class: "card veto" },
        h("div", { class: "ic", "aria-hidden": "true" }, icon("ban")),
        h("div", {},
          h("h3", {}, v.scope === "global" ? "Запрет на новые покупки: весь рынок" : `Запрет на новые покупки: ${v.scope}`),
          h("p", {}, v.reason),
          h("p", {}, "Основание: ", safeLink(v.url, v.title), ` — ${v.source}`, v.more ? ` и ещё ${v.more} ${v.more === 1 ? "новость" : "новости"} о том же` : ""),
          h("span", { class: "until" }, icon("clock"), `действует до ${when(v.until)}`))));
    }
    const relevant = st.news.items.filter((n) => n.relevant);
    const list = showAllNews ? st.news.items : relevant;
    const hidden = st.news.items.length - relevant.length;

    const body = list.length
      ? h("div", { class: "news" }, list.map((n) => {
          const [ic, cls, label] = n.relevant ? (DIRECTION[n.direction] || DIRECTION.neutral) : ["flat", "", "Не влияет на цену"];
          const [level, sevLabel] = n.relevant ? (SEVERITY[n.severity] || SEVERITY.none) : [0, ""];
          return h("article", { class: "news-item" },
            h("div", { class: `dir ${cls}`, "aria-hidden": "true" }, icon(ic)),
            h("div", {},
              h("div", { class: "title" }, safeLink(n.url, n.title), n.veto ? h("span", { class: "tag" }, icon("ban"), "вызвала запрет") : null),
              h("div", { class: "meta" }, h("span", {}, `${n.source} · ${when(n.published_at)}`), ...n.assets.map((a) => h("span", { class: "asset" }, a === "MARKET" ? "весь рынок" : a))),
              n.reason ? h("div", { class: "reason" }, n.reason) : null),
            h("div", { class: "impact" },
              h("div", { class: "lab" }, label),
              n.relevant ? h("div", { class: "dots", role: "img", "aria-label": sevLabel }, [1, 2, 3].map((i) => h("i", { class: i <= level ? "on" : "" }))) : null,
              n.relevant ? h("span", { class: "conf" }, `${sevLabel} · ${CONFIDENCE[n.confidence] || ""}`) : null));
        }))
      : h("div", { class: "empty" },
          h("div", { class: "ic", "aria-hidden": "true" }, icon("news")),
          h("div", {}, st.news.counts.scored
            ? [h("b", {}, "Значимых новостей нет"), h("span", {}, "Среди последних оценённых новостей нет влияющих на цену.")]
            : [h("b", {}, "Новости ещё не оценивались"), h("span", {}, "Запустите новостной модуль: python -m news_guard run")]));

    out.push(h("div", { class: "card" }, body,
      hidden > 0 ? h("button", { class: "more", type: "button", onclick: () => { showAllNews = !showAllNews; render(); } },
        icon("chevron"), showAllNews ? "Скрыть не влияющие на цену" : `Показать ещё ${hidden} — не влияющие на цену`) : null));
    return out;
  }

  function render() {
    const st = state;
    const main = document.getElementById("main");
    const holdingPairs = new Set(st.trades.open.map((t) => t.pair));

    document.getElementById("subtitle").textContent =
      `Стратегия ${st.strategy} · ${st.pairs.map((p) => p.pair.split("/")[0]).join(", ") || "нет монет"}`;
    document.getElementById("mode").replaceChildren(icon("flask"),
      h("strong", {}, st.mode === "dry_run" ? "Тестовый режим" : "Реальная торговля"));
    const bot = st.bot;
    document.getElementById("bot-status").replaceChildren(
      h("span", { class: `live ${bot.running ? "good" : "critical"}` }),
      h("strong", {}, bot.running ? "Робот работает" : "Робот остановлен"),
      h("span", { class: "extra" }, bot.last_heartbeat ? `· отклик ${ago(bot.age_seconds)}` : "· журнал не найден"));
    const fresh = st.news.age_seconds !== null && st.news.age_seconds < 900;
    document.getElementById("news-status").replaceChildren(
      h("span", { class: `live ${fresh ? "good" : "warning"}` }),
      fresh ? "Новости обновляются" : "Новости на паузе",
      h("span", { class: "extra" }, st.news.updated_at ? `· ${ago(st.news.age_seconds)}` : ""));

    const filters = h("div", { class: "seg", role: "group", "aria-label": "Период графиков" }, RANGES.map((r) =>
      h("button", { type: "button", "aria-pressed": String(r.days === rangeDays), onclick: () => {
        rangeDays = r.days;
        try { localStorage.setItem("range", String(r.days)); } catch (e) { /* хранилище недоступно */ }
        render();
      } }, r.label)));

    main.replaceChildren(
      h("div", { class: "hero" }, stateCard(st), balanceCard(st)),
      h("div", { class: "section-head" }, h("h2", {}, icon("activity"), "Сигналы по монетам"), filters),
      st.pairs.length
        ? h("div", { class: "signals" }, st.pairs.map((p) => signalCard(p, holdingPairs.has(p.pair))))
        : h("div", { class: "card empty" }, h("div", { class: "ic" }, icon("activity")), h("div", {}, h("b", {}, "Нет данных о ценах"), h("span", {}, "Проверьте подключение к интернету."))),
      h("div", { class: "section-head" }, h("h2", {}, icon("list"), "Сделки")),
      h("div", {}, tradesSection(st)),
      h("div", { class: "section-head" }, h("h2", {}, icon("news"), "Новости и запреты"),
        h("span", { class: "hint" }, `оценено ${st.news.counts.scored} из ${st.news.counts.items}`)),
      h("div", {}, newsSection(st)));

    if (firstRender) { firstRender = false; setTimeout(() => main.classList.remove("first"), 900); }
    drawCharts();
    document.getElementById("updated").textContent = `Данные на ${when(st.generated_at)}; цены — ${st.market_source}.`;
  }

  function drawCharts() {
    if (!state) return;
    document.querySelectorAll(".chart[data-pair]").forEach((host) => {
      const pair = state.pairs.find((p) => p.pair === host.dataset.pair);
      if (pair) drawChart(host, pair, rangeDays);
    });
  }

  async function refresh() {
    const main = document.getElementById("main");
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const open = [...document.querySelectorAll("details.table-view")].map((d) => d.open);
      state = await response.json();
      render();
      document.querySelectorAll("details.table-view").forEach((d, i) => { d.open = Boolean(open[i]); });
      main.classList.remove("stale");
    } catch (error) {
      main.classList.add("stale"); // прежние данные остаются на экране
      if (!state) main.replaceChildren(h("div", { class: "card empty" }, h("div", { class: "ic" }, icon("power")),
        h("div", {}, h("b", {}, "Панель не получила данные"), h("span", {}, "Проверьте, что сервер панели запущен."))));
      document.getElementById("updated").textContent = "Не удалось обновить данные — показаны последние полученные.";
    }
  }

  // ---------- тема ----------
  const root = document.documentElement;
  try { const saved = localStorage.getItem("theme"); if (saved) root.dataset.theme = saved; } catch (e) { /* хранилище недоступно */ }
  document.getElementById("theme").addEventListener("click", () => {
    const light = root.dataset.theme ? root.dataset.theme === "light" : matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = light ? "dark" : "light";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) { /* хранилище недоступно */ }
  });

  let resizeTimer = 0;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });

  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
