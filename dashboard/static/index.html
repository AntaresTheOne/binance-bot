<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель робота</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f2ee;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --series-price: #0b0b0b;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --good-text: #006300;
    --critical-text: #a32222;
    --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #242422;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --series-price: #f0efec;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --good-text: #0ca30c;
      --critical-text: #e66767;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #242422;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-price: #f0efec;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --good-text: #0ca30c;
    --critical-text: #e66767;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; border-radius: 6px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }

  /* ---------- шапка ---------- */
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 18px; }
  header.top h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .spacer { flex: 1 1 auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 13px; color: var(--ink-2); white-space: nowrap;
  }
  .pill strong { color: var(--ink); font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.good { background: var(--good); }
  .dot.critical { background: var(--critical); }
  .dot.warning { background: var(--warning); }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 999px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    display: inline-grid; place-items: center;
  }
  .icon-btn:hover { background: var(--surface-2); }

  /* ---------- карточки ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 30px 0 10px; }
  .row-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }

  .now { display: grid; gap: 6px; }
  .now h2 { font-size: 24px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -0.015em; }
  .now ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--ink-2); }
  .now .eyebrow { font-size: 13px; color: var(--muted); }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .tile { padding: 16px 18px; }
  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .value { font-size: 28px; font-weight: 650; line-height: 1.2; margin-top: 4px; letter-spacing: -0.02em; }
  .tile.hero { grid-column: span 2; }
  .tile.hero .value { font-size: 48px; line-height: 1.05; }
  .tile .unit { font-size: 0.5em; font-weight: 500; color: var(--ink-2); margin-left: 6px; letter-spacing: 0; }
  .tile .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .delta { display: inline-flex; align-items: center; gap: 5px; }
  .delta.up { color: var(--good-text); }
  .delta.down { color: var(--critical-text); }

  /* ---------- сигналы ---------- */
  .filters { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .filters button { border: 0; background: transparent; padding: 5px 13px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .signals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .signal h3 { margin: 0; font-size: 18px; font-weight: 650; }
  .signal .price { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; margin-top: 10px; }
  .signal .price small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--ink); white-space: nowrap; }
  .badge svg { flex: none; }
  .votes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
  .vote { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
  .vote .k { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .vote .v { font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .vote .s { font-size: 12px; color: var(--muted); }
  .explain { margin: 12px 0 2px; color: var(--ink-2); font-size: 14px; }

  .chart { position: relative; margin-top: 14px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .chart text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .endlabel { fill: var(--ink); font-weight: 600; font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key { width: 14px; height: 0; border-top: 2px solid; border-radius: 2px; flex: none; }
  .tip {
    position: absolute; pointer-events: none; z-index: 2; min-width: 190px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14); padding: 9px 11px; font-size: 12.5px; display: none;
  }
  .tip .d { font-weight: 600; margin-bottom: 5px; }
  .tip .r { display: flex; align-items: center; gap: 7px; color: var(--ink-2); }
  .tip .r b { margin-left: auto; padding-left: 14px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  details.table-view { margin-top: 10px; }
  details.table-view summary { cursor: pointer; font-size: 13px; color: var(--ink-2); width: fit-content; }

  /* ---------- таблицы ---------- */
  .scroll-x { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--ink-2); padding: 6px 0; }
  .empty b { color: var(--ink); font-weight: 600; }

  /* ---------- новости ---------- */
  .veto { border-left: 4px solid var(--critical); }
  .veto + .veto { margin-top: 10px; }
  .veto h3 { margin: 0 0 4px; font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
  .veto p { margin: 2px 0; color: var(--ink-2); }
  .news { display: grid; gap: 0; }
  .news-item { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 4px 16px; padding: 13px 0; border-bottom: 1px solid var(--grid); }
  .news-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .news-item:first-child { padding-top: 0; }
  .news-item .title { font-weight: 600; }
  .news-item .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .news-item .reason { color: var(--ink-2); margin-top: 4px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--critical); color: var(--ink); margin-left: 8px; vertical-align: 2px; }
  .linkish { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 3px; font-size: 13px; }

  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  .stale { opacity: 0.55; transition: opacity 0.2s; }

  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .signals { grid-template-columns: minmax(0, 1fr); }
    .tile.hero .value { font-size: 40px; }
  }
  @media (max-width: 560px) {
    .news-item { grid-template-columns: minmax(0, 1fr); }
    .tiles { grid-template-columns: minmax(0, 1fr); }
    .tile.hero { grid-column: auto; }
    .vote { padding: 8px; }
    .now h2 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1>Торговый робот</h1>
    <span class="pill" id="mode"></span>
    <span class="spacer"></span>
    <span class="pill" id="bot-status"><span class="dot"></span>Загрузка…</span>
    <span class="pill" id="news-status"></span>
    <button class="icon-btn" id="theme" type="button" aria-label="Переключить тему" title="Светлая или тёмная тема">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </header>

  <main id="main" aria-live="polite"></main>

  <footer>
    <p>Панель только показывает данные и ничем не управляет: она не может купить, продать или изменить настройки робота.
    Обновляется сама каждые 30 секунд. <span id="updated"></span></p>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const SERIES = [
    { key: "close", name: "Цена закрытия дня", color: "var(--series-price)" },
    { key: "sma50", name: "Средняя за 50 дней", color: "var(--series-1)" },
    { key: "sma100", name: "Средняя за 100 дней", color: "var(--series-2)" },
    { key: "sma200", name: "Средняя за 200 дней", color: "var(--series-3)" },
  ];
  const RANGES = [{ days: 90, label: "90 дней" }, { days: 180, label: "180 дней" }, { days: 365, label: "Год" }];
  const SVG_NS = "http://www.w3.org/2000/svg";

  let state = null;
  let rangeDays = 180;
  let showAllNews = false;
  try { rangeDays = Number(localStorage.getItem("range")) || 180; } catch (e) { /* хранилище недоступно */ }

  // ---------- помощники ----------
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      el.append(child.nodeType ? child : document.createTextNode(String(child)));
    }
    return el;
  }
  function s(tag, attrs, ...children) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
    for (const child of children.flat()) if (child) el.append(child.nodeType ? child : document.createTextNode(String(child)));
    return el;
  }
  const nf0 = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nf1 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const price = (v) => (v === null || v === undefined ? "—" : Math.abs(v) >= 1000 ? nf0.format(v) : nf2.format(v));
  const signed = (v, fmt) => (v > 0 ? "+" : v < 0 ? "−" : "") + fmt.format(Math.abs(v));
  const dtf = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const dayf = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  const dayShort = new Intl.DateTimeFormat("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC" });
  const monthf = new Intl.DateTimeFormat("ru-RU", { month: "short", timeZone: "UTC" });
  const when = (iso) => (iso ? dtf.format(new Date(iso)) : "—");

  function ago(seconds) {
    if (seconds === null || seconds === undefined) return "нет данных";
    if (seconds < 90) return `${Math.max(0, Math.round(seconds))} с назад`;
    if (seconds < 5400) return `${Math.round(seconds / 60)} мин назад`;
    if (seconds < 129600) return `${Math.round(seconds / 3600)} ч назад`;
    return `${Math.round(seconds / 86400)} дн назад`;
  }

  const ICONS = {
    up: '<path d="M8 3l5 8H3z" fill="currentColor"/>',
    down: '<path d="M8 13L3 5h10z" fill="currentColor"/>',
    stop: '<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 12L12 4" stroke="currentColor" stroke-width="2"/>',
    flat: '<path d="M3 8h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
  };
  function icon(name, color, size = 14) {
    const span = h("span", { style: `display:inline-grid;color:${color}`, "aria-hidden": "true" });
    span.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 16 16">${ICONS[name]}</svg>`;
    return span;
  }

  // ---------- график ----------
  function niceTicks(min, max, count) {
    const span = max - min || 1;
    const raw = span / count;
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * pow).find((v) => v >= raw);
    const ticks = [];
    for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) ticks.push(Number(v.toFixed(8)));
    return ticks;
  }
  function axisLabel(v, top) {
    if (top >= 10000) return `${nf0.format(v / 1000)} тыс.`;
    return nf0.format(v);
  }

  function drawChart(host, pair, days) {
    host.replaceChildren();
    const all = pair.series;
    const from = Math.max(0, all.dates.length - days);
    const dates = all.dates.slice(from);
    const lines = SERIES.map((def) => ({ ...def, values: all[def.key].slice(from) }));
    const n = dates.length;
    if (n < 2) { host.append(h("p", { class: "empty" }, "Недостаточно данных для графика.")); return; }

    const W = Math.max(300, host.clientWidth), H = 270;
    const m = { t: 12, r: 62, b: 26, l: 54 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const flat = lines.flatMap((l) => l.values).filter((v) => v !== null);
    let lo = Math.min(...flat), hi = Math.max(...flat);
    const pad = (hi - lo) * 0.06 || hi * 0.02;
    lo -= pad; hi += pad;
    const x = (i) => m.l + (i / (n - 1)) * iw;
    const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * ih;

    const svg = s("svg", {
      viewBox: `0 0 ${W} ${H}`, role: "img", tabindex: "0",
      "aria-label": `${pair.pair}: цена закрытия и три скользящие средние за ${n} дн. Значения — в таблице под графиком.`,
    });

    for (const t of niceTicks(lo, hi, 4)) {
      svg.append(s("line", { x1: m.l, x2: m.l + iw, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }));
      svg.append(s("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }, axisLabel(t, hi)));
    }
    svg.append(s("line", { x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 }));

    const months = [];
    dates.forEach((d, i) => { if (d.endsWith("-01")) months.push(i); });
    const every = Math.max(1, Math.ceil((months.length * 46) / iw));
    months.forEach((i, k) => {
      if (k % every) return;
      const date = new Date(dates[i] + "T00:00:00Z");
      const label = date.getUTCMonth() === 0 ? String(date.getUTCFullYear()) : monthf.format(date).replace(".", "");
      if (x(i) > m.l + 12 && x(i) < m.l + iw - 12) svg.append(s("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, label));
    });

    // Средние рисуются первыми, цена — поверх.
    for (const line of [...lines].reverse()) {
      let d = "", pen = false;
      line.values.forEach((v, i) => {
        if (v === null) { pen = false; return; }
        d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`;
        pen = true;
      });
      svg.append(s("path", { d, fill: "none", stroke: line.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }

    const lastPrice = lines[0].values[n - 1];
    svg.append(s("circle", { cx: x(n - 1), cy: y(lastPrice), r: 4, fill: "var(--series-price)", stroke: "var(--surface)", "stroke-width": 2 }));
    svg.append(s("text", { class: "endlabel", x: x(n - 1) + 9, y: y(lastPrice) + 4 }, price(lastPrice)));

    const cross = s("g", { style: "display:none" });
    const rule = s("line", { y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 });
    const dots = lines.map((l) => s("circle", { r: 4, fill: l.color, stroke: "var(--surface)", "stroke-width": 2 }));
    cross.append(rule, ...dots);
    svg.append(cross);

    const tip = h("div", { class: "tip", role: "status" });
    function show(i) {
      i = Math.max(0, Math.min(n - 1, i));
      svg.dataset.index = i;
      cross.style.display = "";
      rule.setAttribute("x1", x(i)); rule.setAttribute("x2", x(i));
      lines.forEach((l, k) => {
        const v = l.values[i];
        dots[k].style.display = v === null ? "none" : "";
        if (v !== null) { dots[k].setAttribute("cx", x(i)); dots[k].setAttribute("cy", y(v)); }
      });
      tip.replaceChildren(
        h("div", { class: "d" }, dayf.format(new Date(dates[i] + "T00:00:00Z"))),
        ...lines.map((l) => h("div", { class: "r" }, h("span", { class: "key", style: `border-color:${l.color}` }), l.name, h("b", {}, price(l.values[i])))),
      );
      tip.style.display = "block";
      const px = (x(i) / W) * host.clientWidth;
      const tw = tip.offsetWidth;
      tip.style.left = `${Math.max(0, Math.min(host.clientWidth - tw, px > host.clientWidth / 2 ? px - tw - 12 : px + 12))}px`;
      tip.style.top = "8px";
    }
    function hide() { cross.style.display = "none"; tip.style.display = "none"; }
    svg.addEventListener("pointermove", (e) => {
      const box = svg.getBoundingClientRect();
      const px = ((e.clientX - box.left) / box.width) * W;
      show(Math.round(((px - m.l) / iw) * (n - 1)));
    });
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("focus", () => show(n - 1));
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", (e) => {
      const i = Number(svg.dataset.index ?? n - 1);
      if (e.key === "ArrowLeft") { show(i - 1); e.preventDefault(); }
      if (e.key === "ArrowRight") { show(i + 1); e.preventDefault(); }
    });

    host.append(svg, tip);
  }

  function tableView(pair) {
    const rows = [];
    const sr = pair.series;
    for (let i = sr.dates.length - 1; i >= Math.max(0, sr.dates.length - 14); i--) {
      rows.push(h("tr", {},
        h("td", {}, dayShort.format(new Date(sr.dates[i] + "T00:00:00Z"))),
        ...SERIES.map((d) => h("td", { class: "num" }, price(sr[d.key][i]))),
      ));
    }
    return h("details", { class: "table-view" },
      h("summary", {}, "Показать таблицей (последние 14 дней)"),
      h("div", { class: "scroll-x" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "День"), ...SERIES.map((d) => h("th", { class: "num" }, d.name)))),
        h("tbody", {}, rows),
      )),
    );
  }

  // ---------- разделы ----------
  function signalCard(pair, holding) {
    const coin = pair.pair.split("/")[0];
    const badge = pair.uptrend
      ? h("span", { class: "badge" }, icon("up", "var(--good)"), holding ? "Тренд вверх — позиция открыта" : "Тренд вверх — сигнал на покупку")
      : h("span", { class: "badge" }, icon("down", "var(--critical)"), "Тренд вниз — робот в деньгах");

    const votes = h("div", { class: "votes" }, ["50", "100", "200"].map((w) => {
      const above = pair.above[w];
      return h("div", { class: "vote" },
        h("div", { class: "k", title: `Средняя цена закрытия за ${w} дней` }, icon(above ? "up" : "down", above ? "var(--good)" : "var(--critical)", 12), `Средняя ${w} дн.`),
        h("div", { class: "v" }, price(pair.smas[w])),
        h("div", { class: "s" }, above ? "цена выше" : "цена ниже"),
      );
    }));

    let explain = "";
    if (pair.flip_level !== null) {
      explain = pair.uptrend
        ? `Цена выше ${pair.votes} из 3 средних. Сигнал пропадёт, если день закроется ниже ≈ ${price(pair.flip_level)} (${signed(pair.distance_pct, nf1)}%).`
        : `Цена выше ${pair.votes} из 3 средних, для покупки нужно минимум 2. Это случится, если день закроется выше ≈ ${price(pair.flip_level)} (${signed(pair.distance_pct, nf1)}%).`;
    }

    const chart = h("div", { class: "chart", "data-pair": pair.pair });
    const card = h("section", { class: "card signal" },
      h("div", { class: "row-between" }, h("h3", {}, `${coin} / ${pair.pair.split("/")[1]}`), badge),
      h("div", { class: "price" }, price(pair.price), h("small", {}, `сейчас · закрытие ${dayShort.format(new Date(pair.last_close_date + "T00:00:00Z"))}: ${price(pair.last_close)}`)),
      votes,
      h("p", { class: "explain" }, explain),
      chart,
      h("div", { class: "legend" }, SERIES.map((d) => h("span", {}, h("span", { class: "key", style: `border-color:${d.color}` }), d.name))),
      tableView(pair),
    );
    return card;
  }

  function tradesSection(st) {
    const cur = st.currency;
    const out = [];
    if (st.trades.open.length) {
      out.push(h("div", { class: "card" }, h("div", { class: "scroll-x" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "Монета"), h("th", {}, "Куплено"), h("th", { class: "num" }, "Цена входа"),
          h("th", { class: "num" }, "Цена сейчас"), h("th", { class: "num" }, `Сумма, ${cur}`), h("th", { class: "num" }, "Результат"))),
        h("tbody", {}, st.trades.open.map((t) => h("tr", {},
          h("td", {}, t.pair), h("td", {}, when(t.open_date)), h("td", { class: "num" }, price(t.open_rate)),
          h("td", { class: "num" }, price(t.price)), h("td", { class: "num" }, nf2.format(t.stake)),
          h("td", { class: "num" }, t.profit_abs === null ? "—" : `${signed(t.profit_abs, nf2)} (${signed(t.profit_pct, nf1)}%)`),
        ))),
      ))));
    }
    if (st.trades.closed.length) {
      out.push(h("div", { class: "card", style: out.length ? "margin-top:12px" : "" }, h("div", { class: "scroll-x" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "Монета"), h("th", {}, "Куплено"), h("th", {}, "Продано"), h("th", { class: "num" }, "Цена входа"),
          h("th", { class: "num" }, "Цена выхода"), h("th", { class: "num" }, `Результат, ${cur}`), h("th", { class: "num" }, "%"), h("th", {}, "Причина выхода"))),
        h("tbody", {}, st.trades.closed.map((t) => h("tr", {},
          h("td", {}, t.pair), h("td", {}, when(t.open_date)), h("td", {}, when(t.close_date)),
          h("td", { class: "num" }, price(t.open_rate)), h("td", { class: "num" }, price(t.close_rate)),
          h("td", { class: "num" }, signed(t.profit_abs || 0, nf2)), h("td", { class: "num" }, signed(t.profit_pct || 0, nf1)),
          h("td", {}, ({ trend_lost: "тренд закончился", stop_loss: "аварийный стоп", force_exit: "закрыта вручную" })[t.exit_reason] || t.exit_reason || "—"),
        ))),
      ))));
    }
    if (!out.length) {
      out.push(h("div", { class: "card" }, h("p", { class: "empty" },
        h("b", {}, "Сделок пока нет. "), "Робот покупает только при восходящем тренде; пока его нет, деньги остаются нетронутыми.")));
    }
    return out;
  }

  const DIRECTION = { bearish: ["down", "var(--critical)", "Негатив"], bullish: ["up", "var(--good)", "Позитив"], neutral: ["flat", "var(--muted)", "Нейтрально"] };
  const SEVERITY = { high: "сильное влияние", medium: "среднее влияние", low: "слабое влияние", none: "без влияния" };
  const CONFIDENCE = { high: "уверенность высокая", medium: "уверенность средняя", low: "уверенность низкая" };

  function newsSection(st) {
    const out = [];
    for (const v of st.news.vetoes) {
      out.push(h("div", { class: "card veto" },
        h("h3", {}, icon("stop", "var(--critical)", 16), v.scope === "global" ? "Запрет на новые покупки: весь рынок" : `Запрет на новые покупки: ${v.scope}`),
        h("p", {}, `Действует до ${when(v.until)}. ${v.reason}`),
        h("p", {}, "Основание: ", v.url && /^https?:\/\//.test(v.url) ? h("a", { href: v.url, target: "_blank", rel: "noopener noreferrer" }, v.title) : v.title, ` — ${v.source}`,
          v.more ? ` и ещё ${v.more} ${v.more === 1 ? "новость" : "новости"} о том же` : ""),
      ));
    }
    const relevant = st.news.items.filter((n) => n.relevant);
    const list = showAllNews ? st.news.items : relevant;
    const hidden = st.news.items.length - relevant.length;

    const body = list.length
      ? h("div", { class: "news" }, list.map((n) => {
          const [ic, color, label] = n.relevant ? (DIRECTION[n.direction] || DIRECTION.neutral) : ["flat", "var(--muted)", "Не влияет на цену"];
          return h("article", { class: "news-item" },
            h("div", {},
              h("span", { class: "badge" }, icon(ic, color), label),
              n.relevant ? h("div", { class: "meta" }, `${SEVERITY[n.severity] || ""}`, h("br"), `${CONFIDENCE[n.confidence] || ""}`) : null),
            h("div", {},
              h("div", { class: "title" }, n.url ? h("a", { href: n.url, target: "_blank", rel: "noopener noreferrer" }, n.title) : n.title,
                n.veto ? h("span", { class: "tag" }, "вето") : null),
              h("div", { class: "meta" }, `${n.source} · ${when(n.published_at)}` + (n.assets.length ? ` · ${n.assets.map((a) => (a === "MARKET" ? "весь рынок" : a)).join(", ")}` : "")),
              n.reason ? h("div", { class: "reason" }, n.reason) : null),
          );
        }))
      : h("p", { class: "empty" }, st.news.counts.scored ? "Среди последних новостей нет значимых для цены." : h("b", {}, "Новости ещё не оценивались. "), st.news.counts.scored ? "" : "Запустите новостной модуль: python -m news_guard run");

    out.push(h("div", { class: "card", style: st.news.vetoes.length ? "margin-top:12px" : "" },
      body,
      hidden > 0 ? h("p", { style: "margin:14px 0 0" }, h("button", { class: "linkish", type: "button", onclick: () => { showAllNews = !showAllNews; render(); } },
        showAllNews ? "Скрыть не влияющие на цену" : `Показать ещё ${hidden} — не влияющие на цену`)) : null,
    ));
    return out;
  }

  function render() {
    const st = state;
    const main = document.getElementById("main");
    const holdingPairs = new Set(st.trades.open.map((t) => t.pair));
    const w = st.wallet;
    const total = w.closed_profit + w.open_profit;

    // шапка
    document.getElementById("mode").replaceChildren(
      st.mode === "dry_run" ? h("strong", {}, "Тестовый режим") : h("strong", {}, "Реальная торговля"),
      st.mode === "dry_run" ? " · деньги виртуальные" : "");
    const bot = st.bot;
    document.getElementById("bot-status").replaceChildren(
      h("span", { class: `dot ${bot.running ? "good" : "critical"}` }),
      h("strong", {}, bot.running ? "Робот работает" : "Робот остановлен"),
      bot.last_heartbeat ? ` · отклик ${ago(bot.age_seconds)}` : " · журнал не найден");
    const newsFresh = st.news.age_seconds !== null && st.news.age_seconds < 900;
    document.getElementById("news-status").replaceChildren(
      h("span", { class: `dot ${newsFresh ? "good" : "warning"}` }),
      newsFresh ? "Новости обновляются" : "Новостной модуль не запущен",
      st.news.updated_at ? ` · ${ago(st.news.age_seconds)}` : "");

    const resultClass = total > 0 ? "up" : total < 0 ? "down" : "";
    const tiles = h("div", { class: "tiles" },
      h("div", { class: "card tile hero" },
        h("div", { class: "label" }, "Баланс"),
        h("div", { class: "value" }, nf2.format(w.balance), h("span", { class: "unit" }, st.currency)),
        h("div", { class: "sub" }, `Начальный: ${nf0.format(w.start)} ${st.currency}` + (st.mode === "dry_run" ? " · виртуальные деньги" : ""))),
      h("div", { class: "card tile" },
        h("div", { class: "label" }, "Результат за всё время"),
        h("div", { class: "value" }, h("span", { class: `delta ${resultClass}` },
          total !== 0 ? icon(total > 0 ? "up" : "down", "currentColor", 16) : null, `${signed(total, nf2)}`), h("span", { class: "unit" }, st.currency)),
        h("div", { class: "sub" }, `${signed(w.profit_pct, nf1)}% к начальному балансу`)),
      h("div", { class: "card tile" },
        h("div", { class: "label" }, "Сделки"),
        h("div", { class: "value" }, `${st.stats.open}`, h("span", { class: "unit" }, `открыто из ${st.pairs.length}`)),
        h("div", { class: "sub" }, st.stats.closed ? `Закрыто: ${st.stats.closed} · в плюс ${st.stats.wins}, в минус ${st.stats.losses}` : "Закрытых сделок пока нет")),
    );

    const filters = h("div", { class: "filters", role: "group", "aria-label": "Период графиков" }, RANGES.map((r) =>
      h("button", { type: "button", "aria-pressed": String(r.days === rangeDays), onclick: () => {
        rangeDays = r.days;
        try { localStorage.setItem("range", String(r.days)); } catch (e) { /* хранилище недоступно */ }
        render();
      } }, r.label)));

    main.replaceChildren(
      h("section", { class: "card now" },
        h("div", { class: "eyebrow" }, `Что происходит сейчас · стратегия ${st.strategy}`),
        h("h2", {}, st.headline.title),
        h("ul", {}, st.headline.notes.map((n) => h("li", {}, n)))),
      tiles,
      h("div", { class: "row-between" }, h("h2", { class: "section-title" }, "Сигналы по монетам"), filters),
      st.pairs.length
        ? h("div", { class: "signals" }, st.pairs.map((p) => signalCard(p, holdingPairs.has(p.pair))))
        : h("div", { class: "card" }, h("p", { class: "empty" }, h("b", {}, "Нет данных о ценах. "), "Проверьте подключение к интернету.")),
      h("h2", { class: "section-title" }, "Сделки"),
      ...tradesSection(st),
      h("h2", { class: "section-title" }, "Новости и запреты"),
      ...newsSection(st),
    );

    drawCharts();
    document.getElementById("updated").textContent = `Данные на ${when(st.generated_at)}; цены — ${st.market_source}.`;
  }

  function drawCharts() {
    if (!state) return;
    document.querySelectorAll(".chart[data-pair]").forEach((host) => {
      const pair = state.pairs.find((p) => p.pair === host.dataset.pair);
      if (pair) drawChart(host, pair, rangeDays);
    });
  }

  async function refresh() {
    const main = document.getElementById("main");
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const open = [...document.querySelectorAll("details.table-view")].map((d) => d.open);
      state = await response.json();
      render();
      document.querySelectorAll("details.table-view").forEach((d, i) => { d.open = Boolean(open[i]); });
      main.classList.remove("stale");
    } catch (error) {
      main.classList.add("stale"); // прежние данные остаются на экране
      if (!state) main.replaceChildren(h("div", { class: "card" }, h("p", { class: "empty" }, h("b", {}, "Панель не получила данные. "), "Проверьте, что сервер панели запущен.")));
      document.getElementById("updated").textContent = "Не удалось обновить данные — показаны последние полученные.";
    }
  }

  // ---------- тема ----------
  const root = document.documentElement;
  try { const saved = localStorage.getItem("theme"); if (saved) root.dataset.theme = saved; } catch (e) { /* хранилище недоступно */ }
  document.getElementById("theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) { /* хранилище недоступно */ }
  });

  let resizeTimer = 0;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });

  refresh();
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
